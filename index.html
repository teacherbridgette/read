<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOCAB PARTY!</title>
    <style>
        :root {
            --neon-yellow: #f0ff00;
            --hot-pink: #ff499e;
            --electric-blue: #2a9d8f;
            /* Increased scale for iPad visibility */
            --game-scale: 38vh; 
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Arial Rounded MT Bold', 'Helvetica', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            touch-action: none;
        }

        #bg-video-main {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        .banner-space { height: 15vh; width: 100%; }

        .game-area-bottom {
            height: 85vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        #game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2vh;
            z-index: 1;
        }

        .box {
            width: var(--game-scale); 
            height: calc(var(--game-scale) * 0.8);
            border: 0.8vh solid var(--electric-blue);
            border-radius: 4vh;
            background-color: rgba(0,0,0,0.6);
            background-image: url('box-design.gif');
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        /* THE FULL SCREEN OVERLAY STYLE */
        .box.chosen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            border-radius: 0;
            border: none;
            background: white !important; /* The big white background */
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .content-wrapper {
            display: none;
            text-align: center;
        }

        .box.chosen .content-wrapper { 
            display: flex; 
            flex-direction: column;
            align-items: center;
        }

        .vocab-emoji {
            font-size: 25vh; /* Huge emoji */
            margin-bottom: 2vh;
            display: block;
        }

        .vocab-text {
            display: block;
            font-size: 15vh; /* Massive text */
            font-weight: 900;
            color: #333;
            text-transform: uppercase;
            margin-bottom: 3vh;
            letter-spacing: -2px;
        }

        .box-timer {
            font-size: 8vh;
            color: white;
            background: var(--hot-pink);
            width: 15vh;
            height: 15vh;
            line-height: 15vh;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 10px 30px rgba(255, 73, 158, 0.4);
            animation: heartBeat 1s infinite;
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .box.shimmer {
            border-color: var(--neon-yellow);
            box-shadow: 0 0 5vh var(--neon-yellow);
            transform: scale(1.05);
        }

        #start-btn {
            margin-top: 5vh;
            padding: 3vh 12vw;
            font-size: 6vh;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(45deg, var(--hot-pink), #ff00ff);
            color: white;
            border: none;
            border-radius: 100px;
            box-shadow: 0 0 4vh var(--hot-pink);
            z-index: 10;
        }

        #video-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            z-index: 2000;
        }

        #game-video { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <video id="bg-video-main" autoplay muted loop playsinline>
        <source src="background-loop.mp4" type="video/mp4">
    </video>

    <div class="banner-space"></div>

    <div class="game-area-bottom">
        <div id="game-grid">
            <div class="box" id="box-0"><div class="content-wrapper"><span class="vocab-emoji">📖</span><span class="vocab-text">read</span><div class="box-timer">5</div></div></div>
            <div class="box" id="box-1"><div class="content-wrapper"><span class="vocab-emoji">✏️</span><span class="vocab-text">write</span><div class="box-timer">5</div></div></div>
            <div class="box" id="box-2"><div class="content-wrapper"><span class="vocab-emoji">🎨</span><span class="vocab-text">draw</span><div class="box-timer">5</div></div></div>
            <div class="box" id="box-3"><div class="content-wrapper"><span class="vocab-emoji">🎤</span><span class="vocab-text">sing</span><div class="box-timer">5</div></div></div>
            <div class="box" id="box-4"><div class="content-wrapper"><span class="vocab-emoji">💃</span><span class="vocab-text">dance</span><div class="box-timer">5</div></div></div>
            <div class="box" id="box-5"><div class="content-wrapper"><span class="vocab-emoji">🏊</span><span class="vocab-text">swim</span><div class="box-timer">5</div></div></div>
            <div class="box" id="box-6"><div class="content-wrapper"><span class="vocab-emoji">🦘</span><span class="vocab-text">jump</span><div class="box-timer">5</div></div></div>
        </div>
        <button id="start-btn" onclick="runSelectionCycle()">START!</button>
    </div>

    <div id="video-overlay">
        <video id="game-video" playsinline></video>
    </div>

    <audio id="sfx-shimmer" src="shimmer.mp3" loop></audio>
    <audio id="sfx-stop" src="reveal.mp3"></audio>
    <audio id="sfx-tick" src="tick.mp3"></audio>
    <audio id="sfx-buzzer" src="buzzer.mp3"></audio>

    <script>
        const goodJobVideo = "good-job.mp4";
        const boxes = document.querySelectorAll('.box');
        const overlay = document.getElementById('video-overlay');
        const videoPlayer = document.getElementById('game-video');
        const startBtn = document.getElementById('start-btn');
        
        const sfxShimmer = document.getElementById('sfx-shimmer');
        const sfxStop = document.getElementById('sfx-stop');
        const sfxTick = document.getElementById('sfx-tick');
        const sfxBuzzer = document.getElementById('sfx-buzzer');

        function runSelectionCycle() {
            startBtn.style.visibility = 'hidden';
            boxes.forEach(b => {
                b.classList.remove('chosen', 'shimmer');
                b.querySelector('.box-timer').innerText = "5";
            });
            
            let count = 0;
            let duration = 12 + Math.floor(Math.random() * 8);
            sfxShimmer.play().catch(e => console.log("Audio play blocked"));

            const interval = setInterval(() => {
                boxes.forEach(b => b.classList.remove('shimmer'));
                boxes[count % 7].classList.add('shimmer');
                count++;
                
                if (count > duration) {
                    clearInterval(interval);
                    sfxShimmer.pause();
                    sfxShimmer.currentTime = 0;
                    openBox(count % 7);
                }
            }, 150);
        }

        function openBox(index) {
            sfxStop.play();
            const chosenBox = boxes[index];
            chosenBox.classList.add('chosen');
            
            let timeLeft = 5;
            const timerEl = chosenBox.querySelector('.box-timer');

            const countdown = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    timerEl.innerText = timeLeft;
                    sfxTick.currentTime = 0;
                    sfxTick.play();
                } else {
                    clearInterval(countdown);
                    timerEl.innerText = "0";
                    sfxBuzzer.play();
                    setTimeout(playGoodJob, 1200);
                }
            }, 1000);
        }

        function playGoodJob() {
            overlay.style.display = 'block';
            videoPlayer.src = goodJobVideo;
            videoPlayer.play();

            videoPlayer.onended = () => {
                overlay.style.display = 'none';
                startBtn.style.visibility = 'visible';
                boxes.forEach(b => {
                    b.classList.remove('shimmer', 'chosen');
                });
            };
        }
    </script>
</body>
</html>
