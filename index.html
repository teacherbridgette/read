<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOCAB PARTY!</title>
    <style>
        :root {
            --neon-yellow: #f0ff00;
            --hot-pink: #ff499e;
            --electric-blue: #00f2ff;
            /* Scale optimized for iPad touch targets */
            --game-scale: 22vw; 
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Arial Rounded MT Bold', 'Helvetica', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            touch-action: none;
        }

        #bg-video-main {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        /* Banner at top for spacing */
        .banner-space { height: 10vh; width: 100%; }

        .game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Better Grid Layout: Centered and wrapping nicely */
        #game-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 20px;
            max-width: 1200px;
            z-index: 1;
        }

        .box {
            width: var(--game-scale); 
            height: calc(var(--game-scale) * 0.75);
            border: 0.6vh solid var(--electric-blue);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px); /* Cool frosted glass look */
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        /* THE FULL SCREEN OVERLAY */
        .box.chosen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            border-radius: 0;
            border: none;
            background: white !important;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: popIn 0.4s ease-out forwards;
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .content-wrapper {
            display: none; /* Hidden inside small boxes */
            text-align: center;
        }

        /* Only show content when box is chosen */
        .box.chosen .content-wrapper { 
            display: flex; 
            flex-direction: column;
            align-items: center;
        }

        .vocab-emoji {
            font-size: 30vh;
            margin: 0;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.1));
        }

        .vocab-text {
            font-size: 18vh;
            font-weight: 900;
            color: #222;
            text-transform: uppercase;
            margin: 10px 0 30px 0;
        }

        .box-timer {
            font-size: 10vh;
            color: white;
            background: var(--hot-pink);
            width: 18vh;
            height: 18vh;
            line-height: 18vh;
            border-radius: 50%;
            box-shadow: 0 15px 35px rgba(255, 73, 158, 0.5);
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Active Shimmer Effect during selection */
        .box.shimmer {
            border-color: var(--neon-yellow);
            box-shadow: 0 0 40px var(--neon-yellow);
            transform: scale(1.1);
            background: rgba(255, 255, 0, 0.2);
            z-index: 2;
        }

        #start-btn {
            margin-top: 40px;
            padding: 25px 80px;
            font-size: 40px;
            font-weight: 800;
            background: linear-gradient(to right, var(--hot-pink), #ff00ff);
            color: white;
            border: none;
            border-radius: 60px;
            box-shadow: 0 10px 30px rgba(255, 73, 158, 0.6);
            transition: transform 0.2s;
            z-index: 10;
        }

        #start-btn:active { transform: scale(0.95); }

        #video-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            z-index: 2000;
        }

        #game-video { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <video id="bg-video-main" autoplay muted loop playsinline>
        <source src="background-loop.mp4" type="video/mp4">
    </video>

    <div class="banner-space"></div>

    <div class="game-container">
        <div id="game-grid">
            <div class="box" id="box-0"><div class="content-wrapper"><span class="vocab-emoji">📖</span><span class="vocab-text">read</span><div class="box-timer">5</div></div></div>
            <div class="box" id="box-1"><div class="content-wrapper"><span class="vocab-emoji">✏️</span><span class="vocab-text">write</span><div class="box-timer">5</div></div></div>
            <div class="box" id="box-2"><div class="content-wrapper"><span class="vocab-emoji">🎨</span><span class="vocab-text">draw</span><div class="box-timer">5</div></div></div>
            <div class="box" id="box-3"><div class="content-wrapper"><span class="vocab-emoji">🎤</span><span class="vocab-text">sing</span><div class="box-timer">5</div></div></div>
            <div class="box" id="box-4"><div class="content-wrapper"><span class="vocab-emoji">💃</span><span class="vocab-text">dance</span><div class="box-timer">5</div></div></div>
            <div class="box" id="box-5"><div class="content-wrapper"><span class="vocab-emoji">🏊</span><span class="vocab-text">swim</span><div class="box-timer">5</div></div></div>
            <div class="box" id="box-6"><div class="content-wrapper"><span class="vocab-emoji">🦘</span><span class="vocab-text">jump</span><div class="box-timer">5</div></div></div>
        </div>
        
        <button id="start-btn" onclick="runSelectionCycle()">START PARTY!</button>
    </div>

    <div id="video-overlay">
        <video id="game-video" playsinline></video>
    </div>

    <audio id="sfx-shimmer" src="shimmer.mp3" loop></audio>
    <audio id="sfx-stop" src="reveal.mp3"></audio>
    <audio id="sfx-tick" src="tick.mp3"></audio>
    <audio id="sfx-buzzer" src="buzzer.mp3"></audio>

    <script>
        const boxes = document.querySelectorAll('.box');
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('video-overlay');
        const videoPlayer = document.getElementById('game-video');
        
        const sfxShimmer = document.getElementById('sfx-shimmer');
        const sfxStop = document.getElementById('sfx-stop');
        const sfxTick = document.getElementById('sfx-tick');
        const sfxBuzzer = document.getElementById('sfx-buzzer');

        function runSelectionCycle() {
            startBtn.style.visibility = 'hidden';
            boxes.forEach(b => {
                b.classList.remove('chosen', 'shimmer');
                b.querySelector('.box-timer').innerText = "5";
            });
            
            let count = 0;
            let duration = 15 + Math.floor(Math.random() * 10);
            sfxShimmer.play().catch(() => {});

            const interval = setInterval(() => {
                boxes.forEach(b => b.classList.remove('shimmer'));
                const currentBox = boxes[count % boxes.length];
                currentBox.classList.add('shimmer');
                count++;
                
                if (count > duration) {
                    clearInterval(interval);
                    sfxShimmer.pause();
                    sfxShimmer.currentTime = 0;
                    openBox(count % boxes.length);
                }
            }, 130);
        }

        function openBox(index) {
            sfxStop.play();
            const chosenBox = boxes[index];
            chosenBox.classList.add('chosen');
            
            let timeLeft = 5;
            const timerEl = chosenBox.querySelector('.box-timer');

            const countdown = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    timerEl.innerText = timeLeft;
                    sfxTick.currentTime = 0;
                    sfxTick.play();
                } else {
                    clearInterval(countdown);
                    timerEl.innerText = "0";
                    sfxBuzzer.play();
                    // Brief delay to see the "0" before video pops up
                    setTimeout(() => {
                        playGoodJob();
                    }, 1200);
                }
            }, 1000);
        }

        function playGoodJob() {
            overlay.style.display = 'block';
            videoPlayer.src = "good-job.mp4";
            videoPlayer.play();

            videoPlayer.onended = () => {
                overlay.style.display = 'none';
                startBtn.style.visibility = 'visible';
                boxes.forEach(b => b.classList.remove('chosen', 'shimmer'));
            };
        }
    </script>
</body>
</html>
