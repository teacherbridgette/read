<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOCAB PARTY!</title>
    <style>
        :root {
            --neon-yellow: #f0ff00;
            --hot-pink: #ff499e;
            --electric-blue: #2a9d8f;
            --game-scale: 32vh; /* Made boxes bigger */
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Comic Sans MS', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            touch-action: none;
        }

        #bg-video-main {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        .banner-space { height: 25vh; width: 100%; }

        .game-area-bottom {
            height: 75vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 3vh;
            z-index: 1;
        }

        .box {
            width: var(--game-scale); 
            height: var(--game-scale);
            border: 0.8vh solid var(--electric-blue);
            border-radius: 5vh;
            background-size: cover;
            background-position: center;
            background-image: url('box-design.gif');
            background-color: rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.4s ease;
        }

        /* Centering the text box when chosen */
        .box.chosen {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.8);
            z-index: 1000;
            background-image: url('text.png') !important;
            border: 1vh solid var(--neon-yellow);
            box-shadow: 0 0 60px var(--neon-yellow);
        }

        .content-wrapper {
            display: none;
            text-align: center;
        }

        .box.chosen .content-wrapper { display: block; }

        .vocab-text {
            display: block;
            font-size: 6vh;
            font-weight: bold;
            color: #000;
            text-transform: lowercase;
            margin-bottom: 0.5vh;
        }

        /* Cute Bouncing Timer */
        .box-timer {
            font-size: 5vh;
            color: #ff499e;
            font-weight: bold;
            background: white;
            width: 8vh;
            height: 8vh;
            line-height: 8vh;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            animation: heartBeat 1s infinite;
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .box.shimmer {
            border-color: var(--neon-yellow);
            box-shadow: 0 0 6vh var(--neon-yellow);
        }

        #start-btn {
            margin-top: 4vh;
            padding: 2.5vh 10vw;
            font-size: 5vh;
            font-family: 'Comic Sans MS', sans-serif;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(45deg, var(--hot-pink), var(--electric-blue));
            color: white;
            border: none;
            border-radius: 100px;
            box-shadow: 0 0 4vh var(--hot-pink);
            z-index: 10;
        }

        #video-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            z-index: 2000;
        }

        #game-video { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <video id="bg-video-main" autoplay muted loop playsinline>
        <source src="background-loop.mp4" type="video/mp4">
    </video>

    <div class="banner-space"></div>

    <div class="game-area-bottom">
        <div id="game-grid">
            <div class="box" id="box-0"><div class="content-wrapper"><span class="vocab-text">read</span><div class="box-timer">5</div></div></div>
            <div class="box" id="box-1"><div class="content-wrapper"><span class="vocab-text">write</span><div class="box-timer">5</div></div></div>
            <div class="box" id="box-2"><div class="content-wrapper"><span class="vocab-text">draw</span><div class="box-timer">5</div></div></div>
            <div class="box" id="box-3"><div class="content-wrapper"><span class="vocab-text">sing</span><div class="box-timer">5</div></div></div>
            <div class="box" id="box-4"><div class="content-wrapper"><span class="vocab-text">dance</span><div class="box-timer">5</div></div></div>
            <div class="box" id="box-5"><div class="content-wrapper"><span class="vocab-text">swim</span><div class="box-timer">5</div></div></div>
            <div class="box" id="box-6"><div class="content-wrapper"><span class="vocab-text">jump</span><div class="box-timer">5</div></div></div>
        </div>
        <button id="start-btn" onclick="runSelectionCycle()">START!</button>
    </div>

    <div id="video-overlay">
        <video id="game-video" playsinline></video>
    </div>

    <audio id="sfx-shimmer" src="shimmer.mp3" loop></audio>
    <audio id="sfx-stop" src="reveal.mp3"></audio>
    <audio id="sfx-tick" src="tick.mp3"></audio>
    <audio id="sfx-buzzer" src="buzzer.mp3"></audio>

    <script>
        const goodJobVideo = "good-job.mp4";
        const boxes = document.querySelectorAll('.box');
        const overlay = document.getElementById('video-overlay');
        const videoPlayer = document.getElementById('game-video');
        const startBtn = document.getElementById('start-btn');
        
        const sfxShimmer = document.getElementById('sfx-shimmer');
        const sfxStop = document.getElementById('sfx-stop');
        const sfxTick = document.getElementById('sfx-tick');
        const sfxBuzzer = document.getElementById('sfx-buzzer');

        function runSelectionCycle() {
            startBtn.style.visibility = 'hidden';
            boxes.forEach(b => {
                b.classList.remove('chosen', 'shimmer');
                b.querySelector('.box-timer').innerText = "5";
            });
            
            let count = 0;
            let duration = 15 + Math.floor(Math.random() * 10);
            sfxShimmer.play();

            const interval = setInterval(() => {
                boxes.forEach(b => b.classList.remove('shimmer'));
                boxes[count % 7].classList.add('shimmer');
                count++;
                
                if (count > duration) {
                    clearInterval(interval);
                    sfxShimmer.pause();
                    sfxShimmer.currentTime = 0;
                    openBox(count % 7);
                }
            }, 130);
        }

        function openBox(index) {
            sfxStop.play();
            const chosenBox = boxes[index];
            chosenBox.classList.add('chosen');
            
            let timeLeft = 5;
            const timerEl = chosenBox.querySelector('.box-timer');

            const countdown = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    timerEl.innerText = timeLeft;
                    sfxTick.currentTime = 0;
                    sfxTick.play();
                } else {
                    clearInterval(countdown);
                    timerEl.innerText = "0";
                    sfxBuzzer.play();
                    setTimeout(playGoodJob, 1000);
                }
            }, 1000);
        }

        function playGoodJob() {
            overlay.style.display = 'block';
            videoPlayer.src = goodJobVideo;
            videoPlayer.play();

            videoPlayer.onended = () => {
                overlay.style.display = 'none';
                startBtn.style.visibility = 'visible';
                boxes.forEach(b => {
                    b.classList.remove('shimmer', 'chosen');
                });
            };
        }
    </script>
</body>
</html>
